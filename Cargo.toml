[package]
name = "shiguredo_m3u8"
version = "2026.1.0-canary.0"
edition = "2024"
rust-version = "1.88"
authors = ["Shiguredo Inc."]
license = "Apache-2.0"
description = "M3U8 parser and builder for HLS"
homepage = "https://github.com/shiguredo/m3u8-rs"
repository = "https://github.com/shiguredo/m3u8-rs"
readme = "README.md"
include = ["/src/**", "/LICENSE", "/README.md"]

[lints.rust]
# cargo-fuzz は実行時に --cfg fuzzing を付与するが、通常ビルドでは未定義のため
# Rust 1.80 以降の unexpected_cfgs 警告が出る。ここで既知の cfg として登録し抑制する。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]


[dev-dependencies]
insta = "1.43.2"

[workspace]
members = ["pbt"]
exclude = ["fuzz"]
